<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#1f9d55" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ChefList" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>ChefList</title>
  <style>
    :root{
      --green:#1f9d55;
      --green-dark:#13723d;
      --green-soft:#eaf8ef;
      --bg:#f7f8f4;
      --card:#ffffff;
      --text:#17212b;
      --muted:#6f7a85;
      --line:#e7ebee;
      --danger:#b42318;
      --danger-soft:#fee4e2;
      --shadow:0 8px 24px rgba(16,24,40,.08);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
    body{padding-bottom:28px}
    .splash{
      min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;
      background:linear-gradient(145deg,#1f9d55,#98d24d);color:white;text-align:center;padding:28px;
    }
    .logoBig{
      width:92px;height:92px;border-radius:28px;background:white;color:var(--green);
      display:flex;align-items:center;justify-content:center;font-size:46px;box-shadow:0 16px 40px rgba(0,0,0,.16);
      margin-bottom:18px;
    }
    .splash h1{font-size:44px;margin:0 0 8px;font-weight:950;letter-spacing:-1px}
    .splash p{margin:0 0 26px;font-size:19px;opacity:.95}
    .startBtn{background:white;color:var(--green-dark);border:0;border-radius:18px;padding:16px 24px;font-size:19px;font-weight:950;box-shadow:var(--shadow)}
    .app{display:none}
    header{
      background:linear-gradient(145deg,#1f9d55,#8ccf4a);color:white;padding:22px 18px 24px;border-radius:0 0 30px 30px;
      box-shadow:0 10px 25px rgba(31,157,85,.18);
    }
    .headTop{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:46px;height:46px;border-radius:15px;background:white;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900}
    h1{margin:0;font-size:31px;font-weight:950;letter-spacing:-.5px}
    .tag{font-size:14px;opacity:.92;margin-top:3px}
    .date{font-size:14px;font-weight:800;background:rgba(255,255,255,.18);padding:8px 10px;border-radius:14px}
    main{max-width:820px;margin:0 auto;padding:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
    .progressLine{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:950}
    .progressLine span:last-child{color:var(--green-dark)}
    .bar{height:14px;background:#dce4df;border-radius:99px;overflow:hidden}
    .barFill{height:100%;width:0%;background:var(--green);border-radius:99px;transition:.25s}
    .providerCard{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
    .providerLeft{display:flex;align-items:center;gap:13px}
    .iconBubble{width:48px;height:48px;border-radius:16px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:25px}
    .providerName{font-size:20px;font-weight:950}
    .providerSub{font-size:14px;color:var(--muted);margin-top:2px}
    .arrow{font-size:30px;color:#a2acb5}
    .done{background:#f4fff7;border-color:#bde8c9}
    .done .providerSub{color:#128447;font-weight:800}
    button{border:0;border-radius:18px;padding:14px 16px;font-size:17px;font-weight:950}
    .primary{background:var(--green);color:white;width:100%;box-shadow:0 8px 18px rgba(31,157,85,.22)}
    .dark{background:#17212b;color:white;width:100%}
    .danger{background:var(--danger-soft);color:var(--danger);width:100%}
    .ghost{background:#e9edf0;color:#17212b}
    .btnStack{display:grid;gap:10px;margin-top:12px}
    .hidden{display:none!important}
    .screenTitle{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
    .screenTitle h2{margin:0;font-size:27px;letter-spacing:-.4px}
    .search{width:100%;border:1px solid var(--line);background:white;border-radius:18px;padding:15px;font-size:17px;outline:none;margin:6px 0 10px}
    .itemRow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}
    .itemRow:last-child{border-bottom:0}
    .itemName{font-size:17px;font-weight:900}
    .itemHint{font-size:13px;color:var(--muted);margin-top:2px}
    .stepper{display:flex;align-items:center;gap:10px}
    .round{width:50px;height:50px;border-radius:50%;padding:0;background:#eef2f4;color:#17212b;font-size:29px;line-height:1}
    .qty{min-width:42px;text-align:center;font-size:24px;font-weight:950}
    textarea{width:100%;height:265px;border:1px solid var(--line);border-radius:22px;padding:15px;font-size:16px;background:white;line-height:1.35}
    .toast{position:fixed;left:16px;right:16px;bottom:18px;background:#17212b;color:white;border-radius:18px;padding:15px;text-align:center;font-weight:900;display:none;z-index:20}
    .empty{text-align:center;color:var(--muted);padding:24px 8px;font-weight:700}
    .mini{font-size:13px;color:var(--muted);text-align:center;line-height:1.35}
  </style>
</head>
<body>
  <section id="splash" class="splash">
    <div class="logoBig">📦</div>
    <h1>ChefList</h1>
    <p>Organiza tus pedidos.</p>
    <button class="startBtn" onclick="startApp()">Comenzar</button>
  </section>

  <section id="app" class="app">
    <header>
      <div class="headTop">
        <div class="brand">
          <div class="logo">📦</div>
          <div>
            <h1>ChefList</h1>
            <div class="tag">Pedidos de cocina</div>
          </div>
        </div>
        <div class="date" id="dateText"></div>
      </div>
    </header>

    <main>
      <section id="homeScreen">
        <div class="card">
          <div class="progressLine">
            <span>Progreso de hoy</span>
            <span id="progressText">0 de 7</span>
          </div>
          <div class="bar"><div class="barFill" id="barFill"></div></div>
        </div>

        <div id="providerList"></div>

        <div class="btnStack">
          <button class="dark" onclick="openOrders()">📤 Generar pedidos</button>
          <button class="danger" onclick="newDay()">🔄 Empezar nuevo día</button>
        </div>
        <p class="mini">Todo inicia en 0. Solo aparecen en el pedido los productos con cantidad mayor a 0.</p>
      </section>

      <section id="providerScreen" class="hidden">
        <button class="ghost" onclick="showHome()">← Regresar</button>
        <div class="screenTitle">
          <div class="iconBubble" id="providerIcon"></div>
          <h2 id="providerTitle"></h2>
        </div>
        <input class="search" id="searchInput" placeholder="Buscar producto..." oninput="renderItems()">
        <div class="card" id="itemsList"></div>
        <div class="btnStack">
          <button class="primary" onclick="saveProvider()">Guardar proveedor ✓</button>
        </div>
      </section>

      <section id="ordersScreen" class="hidden">
        <button class="ghost" onclick="showHome()">← Regresar</button>
        <div class="screenTitle">
          <div class="iconBubble">💬</div>
          <h2>Pedidos listos</h2>
        </div>
        <textarea id="orderText"></textarea>
        <div class="btnStack">
          <button class="dark" onclick="copyText()">Copiar para WhatsApp</button>
        </div>
      </section>
    </main>
  </section>

  <div class="toast" id="toast"></div>

<script>
const providers = [
  {name:"José Verdura", icon:"🥬", items:[
    "Aguacate","Ajo","Arrugula","Calabacita","Cebolla","Cebolla roja","Cilantro","Comino","Curry en polvo","Espinaca baby","Frijoles","Huevo","Jalapeño","Limon","Manzana granny smith","Mix lechuga","Nuez pecana","Oregano seco","Papa blanca","Paprika","Pepino","Pepita de calabaza","Pimienta negra molida","Tomate cherry","Tomate rojo","Tomatillo","Vinagre blanco","Zanahoria","Perejil liso","Piña","Fresa","Melon","Mango","Uva","Garbanzo","Tortillas blancas","Papa frita","Granola","Lechuga orejona","Arandano deshidratados"
  ]},
  {name:"Sam's", icon:"🛒", items:[
    "Aceite oliva","Aceituna negras cortadas","Aderezo cesar","Aderezo ranch","Arroz","Atun en lata","Chipotle","Elote lata","Fusilli","Mayonesa","Mozzarella fresca","Pasta lasagna barrila laminas","Pesto","Queso feta","Sal","Tomate deshidratado","Toptopos","Chiles en vinagre","Yogurt griego","Queso philadelphia"
  ]},
  {name:"San Juan", icon:"🥩", items:[
    "Molida res 80/20","Bistec sin hueso 125-130gr","Hamburguesas 150gr pieza"
  ]},
  {name:"Laben", icon:"🧀", items:[
    "Mozzarella rallada","Parmesano rallado","Parmesano rasurado","Tomate triturado","Monterrey jack rebanado","Queso cheddar rebanado","Queso panela","Mantequilla"
  ]},
  {name:"Piome", icon:"🍗", items:["Pechuga pollo"]},
  {name:"Bernabé", icon:"🥓", items:["Jamon pavo","Jamón Serrano","Mortadella","Tocino rebanado"]},
  {name:"Houseclean", icon:"🧽", items:["Bolsas de basura","Limpiavidrios","Lavaloza","Fabuloso","Papel secante","Guantes","Esponjas","Fibras","Cloro"]}
];

let current = 0;
let state = {qty:{}, done:{}};
try { state = JSON.parse(localStorage.getItem("cheflist_v1")) || state; } catch(e) {}

function startApp(){
  localStorage.setItem("cheflist_started","yes");
  document.getElementById("splash").style.display="none";
  document.getElementById("app").style.display="block";
  renderHome();
}
function init(){
  const d = new Date();
  document.getElementById("dateText").textContent = d.toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short"});
  if(localStorage.getItem("cheflist_started")==="yes"){ startApp(); }
}
function save(){ localStorage.setItem("cheflist_v1", JSON.stringify(state)); }
function key(pi,item){ return pi + "___" + item; }
function getQty(pi,item){ return state.qty[key(pi,item)] || 0; }
function setQty(pi,item,val){
  state.qty[key(pi,item)] = Math.max(0,val);
  save();
  renderItems();
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",1500);
}
function show(screen){
  ["homeScreen","providerScreen","ordersScreen"].forEach(id=>document.getElementById(id).classList.add("hidden"));
  document.getElementById(screen).classList.remove("hidden");
}
function showHome(){ show("homeScreen"); renderHome(); }
function renderHome(){
  const done = providers.filter((p,i)=>state.done[i]).length;
  document.getElementById("progressText").textContent = done + " de " + providers.length;
  document.getElementById("barFill").style.width = ((done/providers.length)*100) + "%";
  const wrap=document.getElementById("providerList");
  wrap.innerHTML="";
  providers.forEach((p,i)=>{
    const marked = p.items.filter(item=>getQty(i,item)>0).length;
    const div=document.createElement("div");
    div.className="card providerCard" + (state.done[i] ? " done" : "");
    div.onclick=()=>openProvider(i);
    div.innerHTML = `
      <div class="providerLeft">
        <div class="iconBubble">${p.icon}</div>
        <div>
          <div class="providerName">${p.name}</div>
          <div class="providerSub">${state.done[i] ? "✓ Revisado" : "Pendiente"} · ${marked} productos marcados</div>
        </div>
      </div>
      <div class="arrow">›</div>
    `;
    wrap.appendChild(div);
  });
}
function openProvider(i){
  current=i;
  document.getElementById("providerIcon").textContent=providers[i].icon;
  document.getElementById("providerTitle").textContent=providers[i].name;
  document.getElementById("searchInput").value="";
  show("providerScreen");
  renderItems();
}
function renderItems(){
  const q=(document.getElementById("searchInput").value || "").toLowerCase();
  const box=document.getElementById("itemsList");
  box.innerHTML="";
  const list = providers[current].items.filter(item=>item.toLowerCase().includes(q));
  if(list.length===0){
    box.innerHTML='<div class="empty">No encontré ese producto.</div>';
    return;
  }
  list.forEach(item=>{
    const row=document.createElement("div");
    row.className="itemRow";
    row.innerHTML=`
      <div>
        <div class="itemName">${item}</div>
        <div class="itemHint">Cantidad</div>
      </div>
      <div class="stepper">
        <button class="round" aria-label="menos">−</button>
        <div class="qty">${getQty(current,item)}</div>
        <button class="round" aria-label="más">+</button>
      </div>
    `;
    const btns=row.querySelectorAll("button");
    btns[0].onclick=(e)=>{e.stopPropagation(); setQty(current,item,getQty(current,item)-1);};
    btns[1].onclick=(e)=>{e.stopPropagation(); setQty(current,item,getQty(current,item)+1);};
    box.appendChild(row);
  });
}
function saveProvider(){
  state.done[current]=true;
  save();
  toast(providers[current].name + " revisado ✓");
  setTimeout(showHome,450);
}
function makeOrders(){
  const blocks=[];
  providers.forEach((p,i)=>{
    const lines=p.items.filter(item=>getQty(i,item)>0).map(item=>"• " + item + ": " + getQty(i,item));
    if(lines.length>0){
      blocks.push(p.name.toUpperCase() + "\n\n" + lines.join("\n"));
    }
  });
  if(blocks.length===0) return "Todavía no hay productos marcados.";
  return blocks.join("\n\n----------------------\n\n");
}
function openOrders(){
  show("ordersScreen");
  document.getElementById("orderText").value=makeOrders();
}
function copyText(){
  const t=document.getElementById("orderText");
  t.select();
  t.setSelectionRange(0,99999);
  try{ document.execCommand("copy"); toast("Pedido copiado ✓"); }
  catch(e){ toast("Selecciona y copia manualmente"); }
}
function newDay(){
  if(confirm("¿Borrar cantidades y palomitas para empezar un nuevo día?")){
    state={qty:{},done:{}};
    save();
    renderHome();
    toast("Nuevo día listo ✓");
  }
}
init();
</script>
</body>
</html>
