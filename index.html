<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#1f9d55" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ChefList" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>ChefList</title>
  <style>
    :root{
      --green:#1f9d55;--green-dark:#13723d;--green-soft:#eaf8ef;
      --bg:#f7f8f4;--card:#fff;--text:#17212b;--muted:#6f7a85;
      --line:#e7ebee;--danger:#b42318;--danger-soft:#fee4e2;
      --shadow:0 8px 24px rgba(16,24,40,.08);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
    body{padding-bottom:28px}
    header{background:linear-gradient(145deg,#1f9d55,#8ccf4a);color:white;padding:22px 18px 24px;border-radius:0 0 30px 30px;box-shadow:0 10px 25px rgba(31,157,85,.18)}
    .headTop{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:46px;height:46px;border-radius:15px;background:white;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900}
    h1{margin:0;font-size:31px;font-weight:950;letter-spacing:-.5px}.tag{font-size:14px;opacity:.92;margin-top:3px}
    .date{font-size:14px;font-weight:800;background:rgba(255,255,255,.18);padding:8px 10px;border-radius:14px}
    main{max-width:820px;margin:0 auto;padding:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
    .progressLine{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:950}
    .progressLine span:last-child{color:var(--green-dark)}
    .bar{height:14px;background:#dce4df;border-radius:99px;overflow:hidden}.barFill{height:100%;width:0%;background:var(--green);border-radius:99px;transition:.25s}
    .providerCard{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
    .providerLeft{display:flex;align-items:center;gap:13px}.iconBubble{width:48px;height:48px;border-radius:16px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:25px}
    .providerName{font-size:20px;font-weight:950}.providerSub{font-size:14px;color:var(--muted);margin-top:2px}.arrow{font-size:30px;color:#a2acb5}
    .done{background:#f4fff7;border-color:#bde8c9}.done .providerSub{color:#128447;font-weight:800}
    button{border:0;border-radius:18px;padding:14px 16px;font-size:17px;font-weight:950}
    .primary{background:var(--green);color:white;width:100%;box-shadow:0 8px 18px rgba(31,157,85,.22)}
    .dark{background:#17212b;color:white;width:100%}.danger{background:var(--danger-soft);color:var(--danger);width:100%}.ghost{background:#e9edf0;color:#17212b}
    .btnStack{display:grid;gap:10px;margin-top:12px}.hidden{display:none!important}
    .screenTitle{display:flex;align-items:center;gap:10px;margin:4px 0 10px}.screenTitle h2{margin:0;font-size:27px;letter-spacing:-.4px}
    .search{width:100%;border:1px solid var(--line);background:white;border-radius:18px;padding:15px;font-size:17px;outline:none;margin:6px 0 10px}
    .itemRow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}
    .itemRow:last-child{border-bottom:0}.itemName{font-size:17px;font-weight:900}.itemHint{font-size:13px;color:var(--muted);margin-top:2px}
    .tapHint{font-size:11px;color:var(--green-dark);font-weight:800;margin-top:3px}
    .stepper{display:flex;align-items:center;gap:9px}.round{width:48px;height:48px;border-radius:50%;padding:0;background:#eef2f4;color:#17212b;font-size:29px;line-height:1}
    .qty{min-width:72px;text-align:center;font-size:20px;font-weight:950}
    textarea{width:100%;height:300px;border:1px solid var(--line);border-radius:22px;padding:15px;font-size:16px;background:white;line-height:1.4}
    .toast{position:fixed;left:16px;right:16px;bottom:18px;background:#17212b;color:white;border-radius:18px;padding:15px;text-align:center;font-weight:900;display:none;z-index:20}
    .empty{text-align:center;color:var(--muted);padding:24px 8px;font-weight:700}.mini{font-size:13px;color:var(--muted);text-align:center;line-height:1.35}
    .version{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
    .modalBg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;z-index:30}
    .modal{background:white;width:100%;border-radius:26px 26px 0 0;padding:18px;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
    .modal h3{margin:0 0 4px;font-size:23px}.modal p{margin:0 0 14px;color:var(--muted)}
    .modal select,.modal input{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px;font-size:17px;margin:8px 0;background:white}
  </style>
</head>
<body>
  <header>
    <div class="headTop">
      <div class="brand">
        <div class="logo">📦</div>
        <div><h1>ChefList</h1><div class="tag">Pedidos de cocina</div></div>
      </div>
      <div class="date" id="dateText"></div>
    </div>
  </header>

  <main>
    <section id="homeScreen">
      <div class="card">
        <div class="progressLine"><span>Progreso de hoy</span><span id="progressText">0 de 7</span></div>
        <div class="bar"><div class="barFill" id="barFill"></div></div>
      </div>
      <div id="providerList"></div>
      <div class="btnStack">
        <button class="dark" onclick="openOrders()">📤 Generar pedidos</button>
        <button class="danger" onclick="newDay()">🔄 Empezar nuevo día</button>
      </div>
      <p class="mini">Toca el nombre de un producto para cambiar su unidad.</p>
      <div class="version">ChefList v4 · unidades editables + WhatsApp bonito</div>
    </section>

    <section id="providerScreen" class="hidden">
      <button class="ghost" onclick="showHome()">← Regresar</button>
      <div class="screenTitle"><div class="iconBubble" id="providerIcon"></div><h2 id="providerTitle"></h2></div>
      <input class="search" id="searchInput" placeholder="Buscar producto..." oninput="renderItems()">
      <div class="card" id="itemsList"></div>
      <div class="btnStack"><button class="primary" onclick="saveProvider()">Guardar proveedor ✓</button></div>
    </section>

    <section id="ordersScreen" class="hidden">
      <button class="ghost" onclick="showHome()">← Regresar</button>
      <div class="screenTitle"><div class="iconBubble">💬</div><h2>Pedidos listos</h2></div>
      <textarea id="orderText"></textarea>
      <div class="btnStack">
        <button class="dark" onclick="copyText()">Copiar para WhatsApp</button>
        <button class="primary" onclick="openWhatsApp()">Abrir WhatsApp</button>
      </div>
    </section>
  </main>

  <div class="modalBg" id="unitModal">
    <div class="modal">
      <h3 id="modalProduct">Editar unidad</h3>
      <p>Elige cómo se pide este producto.</p>
      <select id="unitSelect" onchange="toggleCustomUnit()">
        <option>kg</option><option>pieza</option><option>caja</option><option>manojo</option><option>litro</option>
        <option>paquete</option><option>bolsa</option><option>malla</option><option>cartera</option><option>bote</option>
        <option>charola</option><option>lata</option><option>par</option><option>costal</option><option>cubeta</option><option>rollo</option><option>otro</option>
      </select>
      <input id="customUnit" class="hidden" placeholder="Escribe la unidad, ej. garrafón...">
      <div class="btnStack">
        <button class="primary" onclick="saveUnit()">Guardar unidad</button>
        <button class="ghost" onclick="closeUnitModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const providers = [
  {name:"José Verdura", icon:"🥬", items:[
    ["Aguacate","kg"],["Ajo","kg"],["Arrugula","caja"],["Calabacita","kg"],["Cebolla","kg"],["Cebolla roja","kg"],
    ["Cilantro","manojo"],["Comino","pieza"],["Curry en polvo","pieza"],["Espinaca baby","bolsa"],["Frijoles","kg"],["Huevo","cartera"],
    ["Jalapeño","kg"],["Limon","kg"],["Manzana granny smith","kg"],["Mix lechuga","bolsa"],["Nuez pecana","kg"],
    ["Oregano seco","pieza"],["Papa blanca","kg"],["Paprika","pieza"],["Pepino","kg"],["Pepita de calabaza","kg"],
    ["Pimienta negra molida","pieza"],["Tomate cherry","kg"],["Tomate rojo","kg"],["Tomatillo","kg"],["Vinagre blanco","pieza"],
    ["Zanahoria","kg"],["Perejil liso","manojo"],["Piña","pieza"],["Fresa","kg"],["Melon","pieza"],["Mango","kg"],["Uva","kg"],
    ["Garbanzo","kg"],["Tortillas blancas","paquete"],["Papa frita","bolsa"],["Granola","kg"],["Lechuga orejona","pieza"],["Arandano deshidratados","kg"]
  ]},
  {name:"Sam's", icon:"🛒", items:[
    ["Aceite oliva","pieza"],["Aceituna negras cortadas","lata"],["Aderezo cesar","pieza"],["Aderezo ranch","pieza"],["Arroz","bolsa"],
    ["Atun en lata","lata"],["Chipotle","lata"],["Elote lata","lata"],["Fusilli","paquete"],["Mayonesa","pieza"],["Mozzarella fresca","pieza"],
    ["Pasta lasagna barrila laminas","paquete"],["Pesto","pieza"],["Queso feta","pieza"],["Sal","pieza"],["Tomate deshidratado","pieza"],
    ["Toptopos","bolsa"],["Chiles en vinagre","lata"],["Yogurt griego","pieza"],["Queso philadelphia","pieza"]
  ]},
  {name:"San Juan", icon:"🥩", items:[["Molida res 80/20","kg"],["Bistec sin hueso 125-130gr","kg"],["Hamburguesas 150gr pieza","pieza"]]},
  {name:"Laben", icon:"🧀", items:[["Mozzarella rallada","kg"],["Parmesano rallado","kg"],["Parmesano rasurado","kg"],["Tomate triturado","pieza"],["Monterrey jack rebanado","kg"],["Queso cheddar rebanado","kg"],["Queso panela","kg"],["Mantequilla","pieza"]]},
  {name:"Piome", icon:"🍗", items:[["Pechuga pollo","kg"]]},
  {name:"Bernabé", icon:"🥓", items:[["Jamon pavo","kg"],["Jamón Serrano","kg"],["Mortadella","kg"],["Tocino rebanado","kg"]]},
  {name:"Houseclean", icon:"🧽", items:[["Bolsas de basura","paquete"],["Limpiavidrios","pieza"],["Lavaloza","pieza"],["Fabuloso","pieza"],["Papel secante","paquete"],["Guantes","par"],["Esponjas","pieza"],["Fibras","pieza"],["Cloro","pieza"]]}
];

let current = 0;
let editing = {pi:0,item:""};
let state = {qty:{}, done:{}, units:{}};
try { state = JSON.parse(localStorage.getItem("cheflist_v4")) || state; } catch(e) {}

function save(){ localStorage.setItem("cheflist_v4", JSON.stringify(state)); }
function key(pi,item){ return pi + "___" + item; }
function unitOf(pi,item,defaultUnit){ return state.units[key(pi,item)] || defaultUnit; }
function getQty(pi,item){ return state.qty[key(pi,item)] || 0; }
function setQty(pi,item,val){ state.qty[key(pi,item)] = Math.max(0,val); save(); renderItems(); renderHome(); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; setTimeout(()=>t.style.display="none",1500); }
function show(screen){ ["homeScreen","providerScreen","ordersScreen"].forEach(id=>document.getElementById(id).classList.add("hidden")); document.getElementById(screen).classList.remove("hidden"); }
function showHome(){ show("homeScreen"); renderHome(); }
function renderHome(){
  const done = providers.filter((p,i)=>state.done[i]).length;
  document.getElementById("progressText").textContent = done + " de " + providers.length;
  document.getElementById("barFill").style.width = ((done/providers.length)*100) + "%";
  const wrap=document.getElementById("providerList");
  wrap.innerHTML="";
  providers.forEach((p,i)=>{
    const marked = p.items.filter(item=>getQty(i,item[0])>0).length;
    const div=document.createElement("div");
    div.className="card providerCard" + (state.done[i] ? " done" : "");
    div.onclick=()=>openProvider(i);
    div.innerHTML = `<div class="providerLeft"><div class="iconBubble">${p.icon}</div><div><div class="providerName">${p.name}</div><div class="providerSub">${state.done[i] ? "✓ Revisado" : "Pendiente"} · ${marked} productos marcados</div></div></div><div class="arrow">›</div>`;
    wrap.appendChild(div);
  });
}
function openProvider(i){
  current=i;
  document.getElementById("providerIcon").textContent=providers[i].icon;
  document.getElementById("providerTitle").textContent=providers[i].name;
  document.getElementById("searchInput").value="";
  show("providerScreen");
  renderItems();
}
function renderItems(){
  const q=(document.getElementById("searchInput").value || "").toLowerCase();
  const box=document.getElementById("itemsList");
  box.innerHTML="";
  const list = providers[current].items.filter(item=>item[0].toLowerCase().includes(q));
  if(list.length===0){ box.innerHTML='<div class="empty">No encontré ese producto.</div>'; return; }
  list.forEach(([item,defaultUnit])=>{
    const unit = unitOf(current,item,defaultUnit);
    const row=document.createElement("div");
    row.className="itemRow";
    row.innerHTML=`<div onclick="openUnitModal(current,'${item.replace(/'/g,"\\'")}', '${unit.replace(/'/g,"\\'")}')"><div class="itemName">${item}</div><div class="itemHint">Unidad: ${unit}</div><div class="tapHint">Toca para editar unidad</div></div>
    <div class="stepper"><button class="round">−</button><div class="qty">${getQty(current,item)} ${unit}</div><button class="round">+</button></div>`;
    const btns=row.querySelectorAll("button");
    btns[0].onclick=(e)=>{e.stopPropagation(); setQty(current,item,getQty(current,item)-1);};
    btns[1].onclick=(e)=>{e.stopPropagation(); setQty(current,item,getQty(current,item)+1);};
    box.appendChild(row);
  });
}
function openUnitModal(pi,item,unit){
  editing={pi,item};
  document.getElementById("modalProduct").textContent="Editar: " + item;
  const select=document.getElementById("unitSelect");
  const custom=document.getElementById("customUnit");
  const options=[...select.options].map(o=>o.value);
  if(options.includes(unit)){ select.value=unit; custom.classList.add("hidden"); custom.value=""; }
  else { select.value="otro"; custom.classList.remove("hidden"); custom.value=unit; }
  document.getElementById("unitModal").style.display="flex";
}
function closeUnitModal(){ document.getElementById("unitModal").style.display="none"; }
function toggleCustomUnit(){
  const custom=document.getElementById("customUnit");
  if(document.getElementById("unitSelect").value==="otro") custom.classList.remove("hidden");
  else custom.classList.add("hidden");
}
function saveUnit(){
  let unit=document.getElementById("unitSelect").value;
  if(unit==="otro"){
    unit=document.getElementById("customUnit").value.trim();
    if(!unit){ toast("Escribe la unidad"); return; }
  }
  state.units[key(editing.pi,editing.item)] = unit;
  save();
  closeUnitModal();
  renderItems();
  toast("Unidad guardada ✓");
}
function saveProvider(){ state.done[current]=true; save(); toast(providers[current].name + " revisado ✓"); setTimeout(showHome,450); }
function makeOrders(){
  const blocks=[];
  let total=0;
  providers.forEach((p,i)=>{
    const lines=p.items.filter(([item,unit])=>getQty(i,item)>0).map(([item,defaultUnit])=>{
      total++;
      return "• " + item + " ........ " + getQty(i,item) + " " + unitOf(i,item,defaultUnit);
    });
    if(lines.length>0){ blocks.push("🛒 PEDIDO " + p.name.toUpperCase() + "\n\n" + lines.join("\n")); }
  });
  if(blocks.length===0) return "Todavía no hay productos marcados.";
  return "📦 ChefList\nPedido de cocina\nTotal: " + total + " productos\n\n" + blocks.join("\n\n----------------------\n\n") + "\n\nGracias 😊";
}
function openOrders(){ show("ordersScreen"); document.getElementById("orderText").value=makeOrders(); }
function copyText(){ const t=document.getElementById("orderText"); t.select(); t.setSelectionRange(0,99999); try{ document.execCommand("copy"); toast("Pedido copiado ✓"); } catch(e){ toast("Selecciona y copia manualmente"); } }
function openWhatsApp(){ const msg=encodeURIComponent(document.getElementById("orderText").value || makeOrders()); window.location.href="https://wa.me/?text="+msg; }
function newDay(){ if(confirm("¿Borrar cantidades y palomitas para empezar un nuevo día? Las unidades editadas se conservan.")){ state.qty={}; state.done={}; save(); renderHome(); toast("Nuevo día listo ✓"); } }
document.getElementById("dateText").textContent = new Date().toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short"});
renderHome();
</script>
</body>
</html>
